[package]
name = "dataroom-sample-room"
version = "0.1.0"
# `cargo run` means the owner. Without this it became ambiguous the moment `join-by-did`
# was added — and the failure lands on whoever is following the README, which is exactly
# the person least equipped to guess which binary was meant.
default-run = "dataroom-sample-room"
# 2024, for `let ... && ...` chains — the shape the checks in `admission` are written in,
# where a condition and the value it needs read as one clause rather than as a nest.
edition = "2024"

# The demo's only backend. It plays two parts a browser member cannot play for
# itself — the room's **owner**, who admits people, and its **host**, who stores
# what they write — and nothing else. Every other call the site makes is the
# browser talking to its own copy of `vti-rooms`, compiled to wasm.

[dependencies]
# The same crate the browser runs, native. `mls` is the member/owner key layer;
# the demo host keeps records in memory rather than through `vti-rooms::storage`,
# which is honest for a demo and keeps the binary to one file.
vti-rooms = { version = "0.1", features = ["mls"] }

axum = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net"] }
tower-http = { version = "0.6", features = ["fs", "cors"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.23"
# The room issues its own credentials, so it signs: a VIC to admit, a VMC to
# attest membership, and a VAC as the chain root a member attenuates from.
# 0.6, matching the VTI workspace the host is built from. 0.7 changed how an
# authority chain links (parent id → parent digest), so a 0.7 issuer and a 0.6
# verifier cannot interoperate.
affinidi-tdk = "0.12"
# Resolving a room's own `did:peer` to find the mediator it advertises. Pure computation —
# a member finds where to ask to join without a network and without a registry, which is the
# property that let a room be a `did:peer` at all.
affinidi-did-resolver-traits = "0.1"
affinidi-did-common = "0.4"
affinidi-secrets-resolver = "0.5"
# **Directly, and only for `tsp`.** The TDK re-exports this SDK, but its `tsp` feature enables
# the TSP crate without forwarding `affinidi-messaging-sdk/tsp` — and without that the
# transport's inbound stream drops every TSP frame, with a log line and nothing else. Named
# here so cargo's feature unification turns it on for the copy the TDK uses too. Same version
# the TDK resolves, so there is one SDK in the build and not two.
#
# Fixed upstream in affinidi-tdk-rs#785, which is on `main` and in **no published release**:
# 0.13.0 went out before it merged. Checked rather than assumed from the version number —
# dropping this line on the strength of "0.13 is newer than the fix" would silently stop
# every TSP frame arriving. Remove it when a release actually carries the forwarding.
affinidi-messaging-sdk = { version = "0.22", features = ["tsp"] }
# The transport-neutral shapes the delivery layer speaks: `Inbound`, `Protocol`,
# `MessageTransport`. What lets one loop serve both carriers rather than two loops that
# drift.
affinidi-messaging-core = "0.1"
futures-lite = "2"
dtg-credentials = "0.9.1"
affinidi-data-integrity = "0.7"
reqwest = { version = "0.13", features = ["json"] }
uuid = { version = "1", features = ["v4"] }
ed25519-dalek = "3"
multibase = "0.9"
getrandom = "0.4"
chrono = "0.4"

[dev-dependencies]
# The rooms-file tests write one and read it back, so they exercise the parse rather than a
# string this test module made up.
tempfile = "3"
# The admission checks are async — they verify a proof — so the tests need a runtime.
tokio = { version = "1", features = ["rt", "macros"] }
